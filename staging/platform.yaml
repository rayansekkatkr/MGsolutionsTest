AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Staging platform. Stands in for the exam's measurement environment in my own AWS account:
  a VPC with no internet access, AWS services reachable only through VPC endpoints, the IAM
  roles the exam passes as parameters, private image repositories and a load client.

Parameters:
  AzA: {Type: "AWS::EC2::AvailabilityZone::Name", Description: Two zones that offer the GPU instance type}
  AzB: {Type: "AWS::EC2::AvailabilityZone::Name"}

Resources:
  # ---------------- Network: two private subnets, no internet gateway, no NAT ----------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.77.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: exam-staging}]
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Vpc, CidrBlock: 10.77.1.0/24, AvailabilityZone: !Ref AzA, Tags: [{Key: Name, Value: exam-staging-a}]}
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties: {VpcId: !Ref Vpc, CidrBlock: 10.77.2.0/24, AvailabilityZone: !Ref AzB, Tags: [{Key: Name, Value: exam-staging-b}]}
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: !Ref Vpc}
  RouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTable}
  RouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTable}

  # ---------------- Security groups the exam passes in ----------------
  EndpointSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AWS service endpoints (443)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 10.77.0.0/16}
  ClientSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: virtual users (load client)
      VpcId: !Ref Vpc

  # ---------------- VPC endpoints ----------------
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcId: !Ref Vpc
      RouteTableIds: [!Ref RouteTable]
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcId: !Ref Vpc
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
      PrivateDnsEnabled: true
  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcId: !Ref Vpc
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
      PrivateDnsEnabled: true
  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcId: !Ref Vpc
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
      PrivateDnsEnabled: true
  EcsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecs"
      VpcId: !Ref Vpc
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
      PrivateDnsEnabled: true
  EcsAgentEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecs-agent"
      VpcId: !Ref Vpc
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
      PrivateDnsEnabled: true
  EcsTelemetryEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecs-telemetry"
      VpcId: !Ref Vpc
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
      PrivateDnsEnabled: true

  MonitoringEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.monitoring"
      VpcId: !Ref Vpc
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSg]
      PrivateDnsEnabled: true

  # ---------------- Roles the exam passes in ----------------
  # Task role, with the one permission of the exam's AppRole that the template uses.
  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: "sts:AssumeRole"}
      Policies:
        - PolicyName: metrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "cloudwatch:PutMetricData"
                Resource: "*"
                Condition: {StringLike: {"cloudwatch:namespace": "exam-r*"}}
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: "sts:AssumeRole"}
      ManagedPolicyArns: ["arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"]
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: ec2.amazonaws.com}, Action: "sts:AssumeRole"}
      ManagedPolicyArns: ["arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role"]
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: {Roles: [!Ref InstanceRole]}

  # ---------------- Private copies of the images (hosts cannot reach public registries) ----------------
  HaproxyRepo:
    Type: AWS::ECR::Repository
    Properties: {RepositoryName: exam-staging/haproxy, EmptyOnDelete: true}
  PythonRepo:
    Type: AWS::ECR::Repository
    Properties: {RepositoryName: exam-staging/python, EmptyOnDelete: true}
  InferenceRepo:
    Type: AWS::ECR::Repository
    Properties: {RepositoryName: exam-staging/inference, EmptyOnDelete: true}

  # Holds the load client's bundle (generator script and test photos); fetched through the S3 gateway endpoint.
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}

  # ---------------- Load client: plays the exam's virtual users from inside the VPC ----------------
  ClientCluster:
    Type: AWS::ECS::Cluster
    Properties: {ClusterName: exam-staging-client}
  ClientLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /exam-staging/client, RetentionInDays: 3}
  ClientTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: exam-staging-client
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "4096"
      Memory: "8192"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: client
          Image: !Sub "${PythonRepo.RepositoryUri}:3.12-slim"
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ClientLogs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: client
          # Fetches the bundle (bench/load_open.py and photos) from a pre-signed URL and runs the
          # generator against URL with the arguments in ARGS. All three are set at run time.
          Command:
            - python
            - -u
            - -c
            - |
              import io, os, shlex, subprocess, sys, tarfile, urllib.request
              bundle = urllib.request.urlopen(os.environ["BUNDLE_URL"], timeout=120).read()
              tarfile.open(fileobj=io.BytesIO(bundle)).extractall("/tmp/bundle")
              command = [sys.executable, "-u", "/tmp/bundle/load_open.py", "--images", "/tmp/bundle/photos",
                         "--url", os.environ["URL"]] + shlex.split(os.environ["ARGS"])
              print("client:", " ".join(command[2:]), flush=True)
              subprocess.call(command)

Outputs:
  VpcId: {Value: !Ref Vpc}
  SubnetIds: {Value: !Join [",", [!Ref SubnetA, !Ref SubnetB]]}
  ClientSecurityGroupId: {Value: !Ref ClientSg}
  EndpointSecurityGroupId: {Value: !Ref EndpointSg}
  TaskExecutionRoleArn: {Value: !GetAtt TaskExecutionRole.Arn}
  AppRoleArn: {Value: !GetAtt AppRole.Arn}
  InstanceProfileArn: {Value: !GetAtt InstanceProfile.Arn}
  HaproxyRepoUri: {Value: !GetAtt HaproxyRepo.RepositoryUri}
  PythonRepoUri: {Value: !GetAtt PythonRepo.RepositoryUri}
  InferenceRepoUri: {Value: !GetAtt InferenceRepo.RepositoryUri}
  BucketName: {Value: !Ref Bucket}
  ClientTaskArn: {Value: !Ref ClientTask}
