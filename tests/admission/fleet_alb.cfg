# Stands in for the fleet ALB in the test: spreads requests over two GPU tasks, keeps sending to a
# task that has died (an ALB does so until its health checks notice), and answers 502 when it
# cannot reach a task. A 503 that a task itself returned ("full") is passed on unchanged.
global
    log stdout format raw local0 notice

defaults
    mode http
    retries 0
    timeout connect 1s
    timeout client 15s
    timeout server 9s

frontend fleet
    bind :8091
    default_backend tasks

backend tasks
    balance roundrobin
    http-response set-header x-from-task 1
    http-after-response set-status 502 if { status 503 } !{ res.hdr(x-from-task) -m found }
    http-after-response del-header x-from-task
    server a 127.0.0.1:8081
    server b 127.0.0.1:18080
