AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  v3 - internal ALB -> ECS (EC2 GPU, 1 task per GPU host). Each task runs a batching inference
  server (same models and weights as the reference, fp16 backbones, several photos per forward
  pass) behind an HAProxy sidecar that caps what reaches it. Under overload the server answers the
  freshest requests and turns the rest away at once. The fleet starts at full size; after a peak,
  when the tasks report that demand is back to a small fraction of capacity, it shrinks to IdleHosts
  (zero by default: nothing but the load balancer is paid for while the service is at rest).

Parameters:
  VpcId: {Type: "AWS::EC2::VPC::Id"}
  SubnetIds: {Type: "List<AWS::EC2::Subnet::Id>"}
  ClientSecurityGroupId: {Type: "AWS::EC2::SecurityGroup::Id"}
  EndpointSecurityGroupId: {Type: "AWS::EC2::SecurityGroup::Id"}
  S3PrefixListId: {Type: String}
  RunId: {Type: String}
  TaskExecutionRoleArn: {Type: String}
  AppRoleArn: {Type: String}
  InstanceProfileArn: {Type: String}
  EcsGpuAmiId: {Type: "AWS::EC2::Image::Id"}
  ImageInference:
    Type: String
    Description: Inference server image (exam/images.json), built from inference/ in the repository
  ImageHaproxy:
    Type: String
    Description: Official HAProxy image (exam/images.json), used unmodified
  Hosts:
    Type: Number
    Default: 8
    Description: GPU hosts at creation and under load (exam cap is 8). One task per host
  IdleHosts:
    Type: Number
    Default: 0
    Description: >-
      GPU hosts kept once a peak is over and demand is a small fraction of capacity. 0 puts the
      service to sleep (requests are then refused until hosts are started again, which takes
      minutes); 1 keeps it answering a trickle of requests at the price of one host
  MaxBatch:
    Type: Number
    Default: 2
    Description: >-
      Photos per forward pass at most. Measured on an L4 under overload: 2 answers 8% fewer
      photos than 3, in 52 ms instead of 71 (median)
  MaxWaiting:
    Type: Number
    Default: 3
    Description: Requests that may wait for the GPU in one inference server (one more than a batch)
  Workers:
    Type: Number
    Default: 1
    Description: >-
      Batches one inference server runs on its GPU at the same time. More than one did not serve
      more photos on an L4 (the GPU is already at its power limit) and made every answer slower
  MaxArrivalRate:
    Type: Number
    Default: 100
    Description: Requests per second the proxy lets through to one inference server. Above this it answers 503 at once
  MaxInSystem:
    Type: Number
    Default: 32
    Description: Requests inside one inference server at most (safety limit, not reached in normal operation)

Resources:
  # ---------------- Security groups: client -> ALB -> proxy port; hosts reach AWS endpoints only ----------------
  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "exam-r${RunId}-alb"
      GroupDescription: entry point - internal ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref ClientSecurityGroupId}
  ServiceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "exam-r${RunId}-service"
      GroupDescription: inference tasks - outbound to the AWS endpoints only (CloudWatch metrics)
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: !Ref EndpointSecurityGroupId}
  HostSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "exam-r${RunId}-host"
      GroupDescription: GPU hosts - AWS endpoints and S3 only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: !Ref EndpointSecurityGroupId}
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3PrefixListId}
  AlbToService:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSg
      IpProtocol: tcp
      FromPort: 8081
      ToPort: 8081
      DestinationSecurityGroupId: !Ref ServiceSg
  ServiceFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ServiceSg
      IpProtocol: tcp
      FromPort: 8081
      ToPort: 8081
      SourceSecurityGroupId: !Ref AlbSg

  # ---------------- GPU hosts ----------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "exam-r${RunId}-cluster"
      ClusterSettings:
        - {Name: containerInsights, Value: enabled}
  HostTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "exam-r${RunId}-gpu"
      LaunchTemplateData:
        ImageId: !Ref EcsGpuAmiId
        InstanceType: g6.xlarge
        IamInstanceProfile: {Arn: !Ref InstanceProfileArn}
        SecurityGroupIds: [!Ref HostSg]
        MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 1}
        Monitoring: {Enabled: true}
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: 100, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            cat >> /etc/ecs/ecs.config <<EOF
            ECS_CLUSTER=exam-r${RunId}-cluster
            ECS_ENABLE_GPU_SUPPORT=true
            ECS_AWSVPC_BLOCK_IMDS=true
            ECS_DISABLE_PRIVILEGED=true
            ECS_IMAGE_PULL_BEHAVIOR=prefer-cached
            EOF
  HostGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: Cluster
    Properties:
      AutoScalingGroupName: !Sub "exam-r${RunId}-gpu"
      MinSize: !Ref IdleHosts
      MaxSize: !Ref Hosts
      DesiredCapacity: !Ref Hosts
      HealthCheckType: EC2
      HealthCheckGracePeriod: 0
      VPCZoneIdentifier: !Ref SubnetIds
      MetricsCollection:
        - Granularity: 1Minute
          Metrics: [GroupInServiceInstances]
      LaunchTemplate:
        LaunchTemplateId: !Ref HostTemplate
        Version: !GetAtt HostTemplate.LatestVersionNumber

  # Fleet size. A GPU host needs about five minutes to become useful, longer than a load stage
  # leaves, so the group starts at Hosts and is not grown reactively. It is shrunk to IdleHosts when
  # the tasks report that a peak is over (FleetIdle), and brought back to Hosts when they report
  # that they turn requests away (FleetSaturated). Both signals come from inference/admission.py.
  ShrinkPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref HostGroup
      PolicyType: StepScaling
      AdjustmentType: ExactCapacity
      StepAdjustments:
        - {MetricIntervalLowerBound: 0, ScalingAdjustment: !Ref IdleHosts}
  GrowPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref HostGroup
      PolicyType: StepScaling
      AdjustmentType: ExactCapacity
      EstimatedInstanceWarmup: 300
      StepAdjustments:
        - {MetricIntervalLowerBound: 0, ScalingAdjustment: !Ref Hosts}

  # ---------------- Inference task: batching inference server + admission proxy ----------------
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/exam-run/r${RunId}/inference"
      RetentionInDays: 7
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "exam-r${RunId}-inference"
      NetworkMode: awsvpc
      RequiresCompatibilities: [EC2]
      Memory: "12288"
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      TaskRoleArn: !Ref AppRoleArn
      ContainerDefinitions:
        # Batching inference server. Reached only through the proxy on localhost. Cpu values are
        # shares, not a ceiling: the task may use the whole host, which runs nothing else.
        - Name: inference
          Image: !Ref ImageInference
          Essential: true
          Cpu: 3072
          Environment:
            - {Name: PRECISION, Value: fp16}
            - {Name: MAX_BATCH, Value: !Ref MaxBatch}
            # One more than a batch: with the arrival rate the proxy lets through, the pen then
            # overflows during every batch under overload, which is what makes the server turn
            # away the requests a batch leaves behind instead of answering them late.
            - {Name: MAX_WAITING, Value: !Ref MaxWaiting}
            - {Name: WORKERS, Value: !Ref Workers}
            # The numeric libraries start one thread per CPU and let idle threads spin. That kept
            # all four CPUs busy for nothing (396% measured, 126% with these settings) and cost
            # 8% of the photos served. One thread each, and no spinning.
            - {Name: OMP_NUM_THREADS, Value: "1"}
            - {Name: MKL_NUM_THREADS, Value: "1"}
            - {Name: OPENBLAS_NUM_THREADS, Value: "1"}
            - {Name: NUMEXPR_NUM_THREADS, Value: "1"}
            - {Name: KMP_BLOCKTIME, Value: "0"}
            - {Name: OMP_WAIT_POLICY, Value: passive}
            - {Name: OPENCV_FOR_THREADS_NUM, Value: "1"}
            - {Name: METRIC_NAMESPACE, Value: !Sub "exam-r${RunId}-fleet"}
          User: "10001"
          ReadonlyRootFilesystem: true
          Privileged: false
          ResourceRequirements: [{Type: GPU, Value: "1"}]
          LinuxParameters:
            InitProcessEnabled: true
            Capabilities: {Drop: [ALL]}
            SharedMemorySize: 1024
            Tmpfs: [{ContainerPath: /tmp, Size: 2048, MountOptions: [rw, nosuid, nodev]}]
          HealthCheck:
            Command: [CMD-SHELL, "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8080/health', timeout=3)\""]
            Interval: 15
            Timeout: 5
            Retries: 3
            StartPeriod: 300
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: inference
              mode: non-blocking
              max-buffer-size: 4m
        # Admission proxy. At 6,000 requests/s the fleet receives about twenty times what it can
        # compute. The proxy answers 503 to the bulk of the excess without involving the inference
        # process, and lets through a steady MaxArrivalRate so that the server always has fresh
        # requests to choose from. MaxInSystem is a safety limit should the server stall.
        - Name: proxy
          Image: !Ref ImageHaproxy
          Essential: true
          Cpu: 512
          User: "99"
          ReadonlyRootFilesystem: true
          Privileged: false
          PortMappings: [{ContainerPort: 8081, Protocol: tcp}]
          DependsOn: [{ContainerName: inference, Condition: START}]
          Ulimits: [{Name: nofile, SoftLimit: 65536, HardLimit: 65536}]
          LinuxParameters:
            InitProcessEnabled: true
            Capabilities: {Drop: [ALL]}
            Tmpfs: [{ContainerPath: /tmp, Size: 16, MountOptions: [rw, nosuid, nodev]}]
          EntryPoint: [sh, -c]
          Command:
            - printf '%s\n' "$HAPROXY_CFG" > /tmp/haproxy.cfg && exec haproxy -db -f /tmp/haproxy.cfg
          Environment:
            - Name: HAPROXY_CFG
              Value: !Sub |
                global
                    log stdout format raw local0 notice
                    nbthread 2

                defaults
                    mode http
                    log global
                    option dontlognull
                    retries 0
                    timeout connect 1s
                    timeout client 15s
                    timeout server 9s
                    timeout queue 1s
                    timeout http-request 5s
                    timeout http-keep-alive 30s

                frontend entry
                    bind :8081
                    acl is_health path /health
                    acl flooding be_sess_rate(infer) ge ${MaxArrivalRate}
                    acl stalled be_conn(infer) ge ${MaxInSystem}
                    http-request deny deny_status 503 if !is_health flooding
                    http-request deny deny_status 503 if !is_health stalled
                    use_backend health if is_health
                    default_backend infer

                backend infer
                    server model 127.0.0.1:8080 maxconn ${MaxInSystem}

                backend health
                    server model 127.0.0.1:8080
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: proxy
              mode: non-blocking
              max-buffer-size: 4m
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "exam-r${RunId}-alb"
      Scheme: internal
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSg]
  Targets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "exam-r${RunId}-tg"
      TargetType: ip
      Protocol: HTTP
      Port: 8081
      VpcId: !Ref VpcId
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 5
      HealthCheckTimeoutSeconds: 3
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: "15"}
        - {Key: load_balancing.algorithm.type, Value: least_outstanding_requests}
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - {Type: forward, TargetGroupArn: !Ref Targets}
  Service:
    Type: AWS::ECS::Service
    DependsOn: [Listener, HostGroup]
    Properties:
      ServiceName: !Sub "exam-r${RunId}-inference"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Task
      LaunchType: EC2
      DesiredCount: !Ref Hosts
      HealthCheckGracePeriodSeconds: 300
      PlacementConstraints:
        - Type: distinctInstance
      PlacementStrategies:
        - {Type: spread, Field: "attribute:ecs.availability-zone"}
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref ServiceSg]
          AssignPublicIp: DISABLED
      LoadBalancers:
        - {ContainerName: proxy, ContainerPort: 8081, TargetGroupArn: !Ref Targets}

  # ---------------- Observability ----------------
  UnhealthyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "exam-r${RunId}-unhealthy-targets"
      AlarmDescription: At least one task fails its health check
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt Targets.TargetGroupFullName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  # Fleet signals published by the tasks (namespace exam-r<RunId>-fleet, one value per task every
  # 5 s). Average > 0.5 means most tasks agree. The idle signal has a second path that needs no
  # CloudWatch API call from the task: the same condition is written to the log and counted here.
  FleetIdleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "exam-r${RunId}-fleet-idle"
      AlarmDescription: The peak is over and demand is a small fraction of capacity - shrink the fleet to IdleHosts
      Namespace: !Sub "exam-r${RunId}-fleet"
      MetricName: FleetIdle
      Statistic: Average
      Period: 10
      EvaluationPeriods: 2
      Threshold: 0.5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ShrinkPolicy]
  FleetIdleLines:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref Logs
      FilterPattern: '"fleet-idle"'
      MetricTransformations:
        - {MetricNamespace: !Sub "exam-r${RunId}-fleet", MetricName: FleetIdleLines, MetricValue: "1"}
  FleetIdleLogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "exam-r${RunId}-fleet-idle-from-logs"
      AlarmDescription: Same condition as fleet-idle, counted from the tasks' log lines (a task writes one every 5 s while idle)
      Namespace: !Sub "exam-r${RunId}-fleet"
      MetricName: FleetIdleLines
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 24
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ShrinkPolicy]
  FleetSaturatedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "exam-r${RunId}-fleet-saturated"
      AlarmDescription: Most tasks turn requests away - demand exceeds capacity, bring the fleet back to Hosts
      Namespace: !Sub "exam-r${RunId}-fleet"
      MetricName: FleetSaturated
      Statistic: Average
      Period: 10
      EvaluationPeriods: 3
      Threshold: 0.5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref GrowPolicy]
  HostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "exam-r${RunId}-hosts-below-target"
      AlarmDescription: Fewer GPU hosts in service than at full size (expected while the fleet is shrunk after a peak)
      Namespace: AWS/AutoScaling
      MetricName: GroupInServiceInstances
      Dimensions:
        - {Name: AutoScalingGroupName, Value: !Ref HostGroup}
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 1
      Threshold: !Ref Hosts
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
  SheddingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "exam-r${RunId}-load-shedding"
      AlarmDescription: Tasks are rejecting requests - demand exceeds fleet capacity
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 60
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  EntryErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "exam-r${RunId}-alb-5xx"
      AlarmDescription: The load balancer itself returns errors
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "exam-r${RunId}-overview"
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "metric", "width": 12, "height": 6, "properties": {"region": "${AWS::Region}", "title": "Requests: total, served, shed by tasks, failed at the ALB", "stat": "Sum", "period": 60,
            "metrics": [["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${Alb.LoadBalancerFullName}"],
                        ["AWS/ApplicationELB", "HTTPCode_Target_2XX_Count", "LoadBalancer", "${Alb.LoadBalancerFullName}"],
                        ["AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${Alb.LoadBalancerFullName}"],
                        ["AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${Alb.LoadBalancerFullName}"]]}},
          {"type": "metric", "width": 12, "height": 6, "properties": {"region": "${AWS::Region}", "title": "Target response time", "period": 60,
            "metrics": [["AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${Alb.LoadBalancerFullName}", {"stat": "p50"}],
                        ["...", {"stat": "p95"}], ["...", {"stat": "p99"}]]}},
          {"type": "metric", "width": 12, "height": 6, "properties": {"region": "${AWS::Region}", "title": "GPU hosts in service / healthy tasks", "stat": "Minimum", "period": 60,
            "metrics": [["AWS/AutoScaling", "GroupInServiceInstances", "AutoScalingGroupName", "${HostGroup}"],
                        ["AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${Targets.TargetGroupFullName}", "LoadBalancer", "${Alb.LoadBalancerFullName}"]]}},
          {"type": "metric", "width": 12, "height": 6, "properties": {"region": "${AWS::Region}", "title": "Fleet signals from the tasks (share of tasks reporting)", "stat": "Average", "period": 10,
            "metrics": [["exam-r${RunId}-fleet", "FleetSaturated"], ["exam-r${RunId}-fleet", "FleetIdle"]]}}
        ]}

Outputs:
  EndpointUrl:
    Value: !Sub "http://${Alb.DNSName}"
