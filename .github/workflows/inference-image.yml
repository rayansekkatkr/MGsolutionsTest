name: inference-image

on:
  push:
    branches: [round3-inference-image]
    paths: ["inference/**", "tests/inference/**", ".github/workflows/inference-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the PyTorch base image
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL && df -h / | tail -1
      - name: Build the image and compare the server with the reference APIs
        run: bash tests/inference/run.sh
      - name: Publish the image that passed, tagged with the commit
        run: |
          REMOTE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mgsolutionstest-inference"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag pose-inference:test "$REMOTE:${GITHUB_SHA::12}"
          docker push -q "$REMOTE:${GITHUB_SHA::12}"
          echo "published: $(docker image inspect "$REMOTE:${GITHUB_SHA::12}" --format '{{index .RepoDigests 0}}')"
