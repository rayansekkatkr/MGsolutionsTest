name: gpu-bench

# Runs only on the temporary self-hosted L4 runner (gpu/up.sh). Never triggered by pull requests.
on:
  push:
    branches: [round3-inference-image]
    paths: ["bench/**", "inference/**", "tests/inference/gpu.sh", ".github/workflows/gpu-bench.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: [self-hosted, gpu-l4]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Measure accuracy and throughput on the L4
        run: bash tests/inference/gpu.sh
