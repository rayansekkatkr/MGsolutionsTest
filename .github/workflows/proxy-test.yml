name: proxy-test

on:
  push:
    branches: [main, round2-admission-proxy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proxy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Run the proxy container as the task definition describes it
        run: bash tests/proxy/run.sh
